<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b16">
<title>Mew — 3D Card Lab</title>
<style>
:root{color-scheme:dark;--bg:#080b16;--panel:#11182a;--line:#27324a;--muted:#93a0bb;--pink:#f3a6e4;--cyan:#8be8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#29325a 0,#10172b 34%,var(--bg) 72%);color:#f5f7ff;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{max-width:1400px;margin:auto;padding:30px 24px 18px}h1{font-size:clamp(28px,5vw,48px);line-height:1;margin:0 0 10px;letter-spacing:-.045em}.sub{color:var(--muted);max-width:760px;margin:0}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.back{color:#b9c9ff;text-decoration:none;border:1px solid var(--line);padding:8px 12px;border-radius:10px}.back:hover{background:#1b2540}
.controls{max-width:1400px;margin:0 auto;padding:0 24px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.controls button{background:#1c2944;border:1px solid #394968;color:white;padding:10px 14px;border-radius:10px;font:inherit;cursor:pointer}.controls button.active{background:#47355f;border-color:#b98ad5}.hint{color:var(--muted);font-size:13px}
.grid{max-width:1400px;margin:auto;padding:0 24px 50px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:22px}
.demo{background:linear-gradient(150deg,#141d32,#0d1323);border:1px solid var(--line);border-radius:17px;padding:14px;min-width:0;box-shadow:0 12px 35px #0005}.demo h2{font-size:15px;margin:0 0 3px}.demo p{font-size:12px;color:var(--muted);margin:0 0 12px;min-height:34px}
.stage{height:340px;display:grid;place-items:center;perspective:900px;touch-action:pan-y;user-select:none;cursor:grab}.stage:active{cursor:grabbing}.card{width:min(100%,220px);aspect-ratio:3/4.2;position:relative;transform-style:preserve-3d;will-change:transform;border-radius:17px;overflow:hidden;background:#b7a0d2;box-shadow:0 22px 40px #0009,0 0 0 1px #ffffff38;--rx:0deg;--ry:0deg;--dx:0px;--dy:0px;transform:rotateX(var(--rx)) rotateY(var(--ry))}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block;transform:translateZ(1px)}.base{position:absolute;inset:0;background:linear-gradient(145deg,#f8d6ef,#a9b5ef 55%,#625c9d);transform:translateZ(0)}
.layer{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}.mew{position:absolute;width:75%;height:76%;left:12.5%;top:9%;filter:drop-shadow(0 8px 7px #49365d77);transform:translate3d(calc(var(--dx)*.45),calc(var(--dy)*.45),28px)}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 25%,#fff 0 5%,#c7f5ff 18%,#a18ee9 55%,#6c68ad 72%,#ffffff55 74%);box-shadow:0 0 20px #b7efff99,inset -8px -9px 16px #3d397655;transform:translateZ(42px)}
.spark{position:absolute;color:#fff8ff;text-shadow:0 0 9px white;font-size:20px;transform:translateZ(55px)}
.shine{position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 35%,#fff0 43%,#ffffff8c 49%,#d5f8ff55 53%,transparent 61%);transform:translateX(calc(var(--shine,0)*1px)) rotate(12deg) translateZ(70px);mix-blend-mode:screen;pointer-events:none}
.gloss{position:absolute;inset:0;border-radius:17px;background:linear-gradient(135deg,#fff5 0%,transparent 25% 70%,#fff2 100%);border:1px solid #ffffff55;transform:translateZ(75px);pointer-events:none}
.caption{position:absolute;left:10px;right:10px;bottom:9px;padding:8px 10px;border-radius:9px;background:#2a2454a8;backdrop-filter:blur(8px);color:#fff;transform:translateZ(32px);border:1px solid #ffffff50}.caption b{display:block;font-size:13px;letter-spacing:.08em}.caption small{font-size:9px;opacity:.8;letter-spacing:.12em}
.v2 .mew{transform:translate3d(calc(var(--dx)*.7),calc(var(--dy)*.7),52px)}.v2 .orb{transform:translate3d(calc(var(--dx)*-.18),calc(var(--dy)*-.18),20px)}
.v3 .card{box-shadow:0 0 0 2px #f7d9ff,0 0 25px #ee9cf4aa,0 22px 40px #0009}.v3 .mew{filter:drop-shadow(0 0 7px #fff) drop-shadow(0 13px 7px #634c8b)}.v3 .shine{mix-blend-mode:color-dodge}
.v4 .mew{width:80%;left:10%;top:8%;transform:translate3d(calc(var(--dx)*.28),calc(var(--dy)*.28),18px)}.v4 .orb{transform:translate3d(calc(var(--dx)*-.35),calc(var(--dy)*-.35),65px);width:48px;height:48px}
.v5 .card{transform:rotateX(calc(var(--rx)*.8)) rotateY(calc(var(--ry)*.8)) rotateZ(calc(var(--ry)*.035))}.v5 .mew{transform:translate3d(calc(var(--dx)*.55),calc(var(--dy)*.55),36px) rotateZ(calc(var(--ry)*-.035))}
.v6 .mew{transform:translate3d(calc(var(--dx)*.9),calc(var(--dy)*.9),70px)}.v6 .caption{transform:translateZ(95px)}.v6 .shine{transform:translateX(calc(var(--shine,0)*1px)) rotate(12deg) translateZ(110px)}
.v7 .card{border:3px solid #f9e4ff}.v7 .mew{transform:translate3d(calc(var(--dx)*.35),calc(var(--dy)*.35),24px)}.v7 .spark{font-size:26px}
.v8 .base{background:radial-gradient(ellipse at 50% 40%,#fce8ff,#9edce9 45%,#5d69a9 100%)}.v8 .mew{transform:translate3d(calc(var(--dx)*.5),calc(var(--dy)*.5),45px) scale(calc(1 + var(--depth,0)*.0005))}
.v9 .card{filter:saturate(1.18) contrast(1.06)}.v9 .mew{transform:translate3d(calc(var(--dx)*.62),calc(var(--dy)*.62),42px)}.v9 .shine{background:linear-gradient(105deg,transparent 25%,#fff0 40%,#fff9 49%,#9df8ff88 52%,transparent 65%)}
.v10 .mew{transform:translate3d(calc(var(--dx)*.75),calc(var(--dy)*.75),58px)}.v10 .orb{transform:translate3d(calc(var(--dx)*-.3),calc(var(--dy)*-.3),78px)}.v10 .caption{transform:translate3d(calc(var(--dx)*.15),calc(var(--dy)*.15),90px)}
@media(max-width:600px){header{padding:24px 16px 14px}.controls{padding:0 16px 18px}.grid{padding:0 16px 36px;gap:14px}.stage{height:320px}}
</style>
</head>
<body>
<header><div class="topline"><div><h1>MEW / 3D CARD LAB</h1><p class="sub">Ten different takes on the layered 2D-to-3D card illusion. Drag, swipe, or move your pointer over a card to tilt it in every direction.</p></div><a class="back" href="../">← Pocketdex</a></div></header>
<div class="controls"><button id="auto" class="active" type="button">Auto-wiggle: on</button><button id="reset" type="button">Reset angles</button><span class="hint">Pointer tilt: up to 30° · Touch: drag across a card</span></div>
<main class="grid" id="grid"></main>
<script>
const variants=[
["01 · Classic foil","Simple layered parallax with a moving foil reflection."],
["02 · Deep cutout","Foreground Pokémon and background drift at different speeds."],
["03 · Holo glow","Neon edge light and a brighter holographic sweep."],
["04 · Floating orb","The energy orb sits forward of the character."],
["05 · Gentle roll","Adds a subtle roll to the normal pitch and yaw."],
["06 · Extreme depth","Large separation between the character, title, and shine."],
["07 · Framed showcase","A bright raised frame and extra star glints."],
["08 · Dreamscape","Soft radial background with a slow floating character."],
["09 · Prism foil","More saturated art with a sharp diagonal prism sweep."],
["10 · Layer stack","Character, orb, and title each occupy their own depth plane."]
];
const mew=`<img class="mew" src="./mew.svg" alt="Mew Pokémon artwork" draggable="false">`;
const scenes=[
`<svg class="scene" viewBox="0 0 220 308" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s0" x2="0" y2="1"><stop stop-color="#8fc7a2"/><stop offset=".55" stop-color="#316b55"/><stop offset="1" stop-color="#102f2b"/></linearGradient><linearGradient id="mist0" x2="0" y2="1"><stop stop-color="#e6f7d9" stop-opacity=".55"/><stop offset="1" stop-color="#e6f7d9" stop-opacity="0"/></linearGradient></defs><rect width="220" height="308" fill="url(#s0)"/><circle cx="155" cy="72" r="37" fill="#f5edc0" opacity=".65"/><path d="M0 110L35 28 62 120 94 15 125 115 165 25 220 120V308H0Z" fill="#244f43"/><path d="M0 155Q55 112 110 160T220 145V308H0Z" fill="#1d4939"/><path d="M0 215Q80 170 220 215V308H0Z" fill="#17392e"/><g fill="#8fc88d"><ellipse cx="15" cy="90" rx="38" ry="23"/><ellipse cx="207" cy="115" rx="42" ry="28"/><ellipse cx="52" cy="153" rx="38" ry="24"/></g><g fill="#d2e8a5" opacity=".7"><circle cx="35" cy="188" r="3"/><circle cx="182" cy="166" r="3"/><circle cx="72" cy="225" r="2"/></g><rect width="220" height="308" fill="url(#mist0)"/></svg>`,
`<svg class="scene" viewBox="0 0 220 308" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s1" x2="0" y2="1"><stop stop-color="#b9c9b1"/><stop offset=".5" stop-color="#667b61"/><stop offset="1" stop-color="#293c35"/></linearGradient></defs><rect width="220" height="308" fill="url(#s1)"/><path d="M0 90L22 28 48 92 76 18 105 96 140 22 171 92 205 25 220 100V308H0Z" fill="#3e5545"/><path d="M0 120H220V308H0Z" fill="#344b3e"/><g fill="#6c8060"><path d="M0 0H24L12 308H0Z"/><path d="M196 0H220L220 308H204Z"/><path d="M20 20L90 120 78 130 8 42Z"/><path d="M205 42L130 125 142 136 220 60Z"/></g><g fill="#c6b88b" opacity=".8"><path d="M40 125H78V230H40Z"/><path d="M145 125H182V230H145Z"/><path d="M32 116H86V130H32Z"/><path d="M137 116H190V130H137Z"/></g><path d="M0 240Q110 195 220 240V308H0Z" fill="#1d342e"/><path d="M90 308L105 175 120 308" fill="#9bb08b" opacity=".3"/></svg>`,
`<svg class="scene" viewBox="0 0 220 308" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s2" x2="0" y2="1"><stop stop-color="#a8d8e6"/><stop offset=".5" stop-color="#548e9a"/><stop offset="1" stop-color="#173d4a"/></linearGradient></defs><rect width="220" height="308" fill="url(#s2)"/><path d="M0 0H58L80 95 63 160 85 220H0Z M220 0H158L140 95 158 160 136 220H220Z" fill="#355c4b"/><path d="M80 0H143L132 120 146 308H73L88 160Z" fill="#d8f3ed" opacity=".9"/><path d="M90 0H132L122 120 132 308H93L104 155Z" fill="#fff" opacity=".5"/><path d="M0 228Q45 205 110 235T220 220V308H0Z" fill="#1b6070"/><path d="M0 256Q60 235 110 260T220 250" stroke="#a8e6e7" stroke-width="5" fill="none" opacity=".6"/><g fill="#8bbd83"><ellipse cx="25" cy="90" rx="36" ry="24"/><ellipse cx="198" cy="112" rx="38" ry="26"/></g></svg>`,
`<svg class="scene" viewBox="0 0 220 308" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s3" x2="0" y2="1"><stop stop-color="#e7b7d8"/><stop offset=".55" stop-color="#8b8db5"/><stop offset="1" stop-color="#334d68"/></linearGradient></defs><rect width="220" height="308" fill="url(#s3)"/><circle cx="110" cy="83" r="43" fill="#ffe8dc" opacity=".65"/><path d="M0 145L42 80 77 147 110 67 150 145 190 78 220 145V308H0Z" fill="#42546b"/><path d="M0 205Q55 165 110 205T220 195V308H0Z" fill="#263d55"/><path d="M0 255Q60 225 120 255T220 245V308H0Z" fill="#192d43"/><path d="M0 184Q45 173 75 190M145 190Q180 170 220 185" stroke="#f4c5d9" stroke-width="3" fill="none" opacity=".65"/><g fill="#e4a9cb"><circle cx="32" cy="229" r="5"/><circle cx="185" cy="217" r="4"/><circle cx="58" cy="270" r="3"/></g></svg>`,
`<svg class="scene" viewBox="0 0 220 308" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s4" x2="0" y2="1"><stop stop-color="#15294a"/><stop offset=".6" stop-color="#35496a"/><stop offset="1" stop-color="#172c3d"/></linearGradient></defs><rect width="220" height="308" fill="url(#s4)"/><circle cx="158" cy="64" r="34" fill="#e7e5d0" opacity=".85"/><circle cx="158" cy="64" r="48" fill="#d9e9ff" opacity=".12"/><path d="M0 125L25 45 58 132 91 35 125 132 171 46 220 140V308H0Z" fill="#172f38"/><path d="M0 185Q55 145 110 183T220 178V308H0Z" fill="#203f43"/><path d="M0 252Q100 220 220 250V308H0Z" fill="#102b34"/><g fill="#d8e6ef"><circle cx="34" cy="43" r="1.8"/><circle cx="88" cy="70" r="1.5"/><circle cx="194" cy="125" r="2"/><circle cx="42" cy="170" r="1.5"/></g><path d="M0 275Q110 250 220 275" stroke="#91c9d1" stroke-width="2" opacity=".5" fill="none"/></svg>`,
`<svg class="scene" viewBox="0 0 220 308" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s5" x2="0" y2="1"><stop stop-color="#c8d9a5"/><stop offset=".55" stop-color="#8cae83"/><stop offset="1" stop-color="#456c54"/></linearGradient></defs><rect width="220" height="308" fill="url(#s5)"/><circle cx="110" cy="105" r="57" fill="#fff1c9" opacity=".45"/><path d="M0 130Q40 80 85 135T170 125T220 130V308H0Z" fill="#5c815a"/><path d="M0 190Q65 145 120 190T220 185V308H0Z" fill="#355e48"/><path d="M0 250Q90 205 220 250V308H0Z" fill="#244a3a"/><g fill="#f3d6e8"><circle cx="24" cy="222" r="5"/><circle cx="45" cy="245" r="4"/><circle cx="184" cy="215" r="5"/><circle cx="155" cy="263" r="4"/></g><g fill="#f6e9bd"><circle cx="24" cy="222" r="2"/><circle cx="184" cy="215" r="2"/></g><g fill="#b5d58b"><ellipse cx="8" cy="80" rx="35" ry="18"/><ellipse cx="210" cy="90" rx="40" ry="20"/></g></svg>`,
`<svg class="scene" viewBox="0 0 220 308" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s6" x2="0" y2="1"><stop stop-color="#20365d"/><stop offset=".6" stop-color="#395d77"/><stop offset="1" stop-color="#172d49"/></linearGradient></defs><rect width="220" height="308" fill="url(#s6)"/><path d="M0 0L45 40 30 180 0 220ZM220 0L175 40 190 180 220 220Z" fill="#172a40"/><g fill="#76d8e9" opacity=".8"><path d="M26 220L45 85 61 220Z"/><path d="M164 220L180 70 201 220Z"/><path d="M80 260L102 125 119 260Z"/></g><g fill="#c7a8ef" opacity=".7"><path d="M58 308L76 180 90 308Z"/><path d="M130 308L146 170 160 308Z"/></g><path d="M0 255Q110 220 220 255V308H0Z" fill="#14263e"/><g fill="#d8faff"><circle cx="47" cy="64" r="2"/><circle cx="152" cy="104" r="2"/><circle cx="108" cy="42" r="1.5"/></g></svg>`,
`<svg class="scene" viewBox="0 0 220 308" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s7" x2="0" y2="1"><stop stop-color="#f5c7a5"/><stop offset=".45" stop-color="#a9b9a0"/><stop offset="1" stop-color="#38564c"/></linearGradient></defs><rect width="220" height="308" fill="url(#s7)"/><circle cx="110" cy="92" r="45" fill="#fff0cf" opacity=".75"/><path d="M0 125Q30 40 72 115T150 105T220 125V308H0Z" fill="#587a62"/><path d="M0 180Q55 125 110 180T220 175V308H0Z" fill="#315a48"/><path d="M0 245Q100 195 220 245V308H0Z" fill="#1e4036"/><g fill="#8eb77c"><ellipse cx="8" cy="72" rx="50" ry="26"/><ellipse cx="210" cy="82" rx="48" ry="27"/><ellipse cx="110" cy="35" rx="65" ry="22"/></g><path d="M0 290Q110 255 220 290" stroke="#c9dca8" stroke-width="4" opacity=".5" fill="none"/></svg>`,
`<svg class="scene" viewBox="0 0 220 308" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s8" x2="0" y2="1"><stop stop-color="#a6c6cf"/><stop offset=".5" stop-color="#759ba8"/><stop offset="1" stop-color="#35596a"/></linearGradient></defs><rect width="220" height="308" fill="url(#s8)"/><path d="M0 130L35 60 70 135 105 45 145 135 185 65 220 130V230H0Z" fill="#526d70"/><path d="M0 176Q55 145 110 176T220 170V308H0Z" fill="#466f78"/><path d="M0 220Q100 190 220 220V308H0Z" fill="#234d5a"/><path d="M0 234Q110 210 220 234" stroke="#c4e4dc" stroke-width="3" opacity=".65" fill="none"/><g fill="#d7e7df" opacity=".45"><ellipse cx="45" cy="165" rx="48" ry="12"/><ellipse cx="164" cy="193" rx="60" ry="14"/></g><path d="M0 20Q50 55 90 18T220 30" stroke="#eaf5ee" stroke-width="12" opacity=".25" fill="none"/></svg>`,
`<svg class="scene" viewBox="0 0 220 308" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s9" x2="0" y2="1"><stop stop-color="#463e83"/><stop offset=".5" stop-color="#9c82c1"/><stop offset="1" stop-color="#253e69"/></linearGradient></defs><rect width="220" height="308" fill="url(#s9)"/><path d="M0 0Q40 50 0 115T0 230M220 0Q180 55 220 120T220 230" stroke="#172e50" stroke-width="30" fill="none"/><g fill="none" stroke-width="8" opacity=".65"><path d="M-20 110Q50 35 110 110T240 90" stroke="#e6a8e8"/><path d="M-20 165Q60 90 120 165T240 145" stroke="#9de5ed"/><path d="M-20 220Q55 150 120 220T240 200" stroke="#f4d5a7"/></g><path d="M0 270Q110 235 220 270V308H0Z" fill="#1b3154"/><g fill="#fff2d5"><circle cx="36" cy="55" r="2"/><circle cx="177" cy="72" r="2"/><circle cx="83" cy="35" r="1.5"/><circle cx="145" cy="245" r="2"/></g></svg>`
];
function cardMarkup(i){return `<article class="demo"><h2>${variants[i][0]}</h2><p>${variants[i][1]}</p><div class="stage"><div class="card v${i+1}"><div class="base"></div>${scenes[i]}<div class="layer"><span class="orb" style="width:39px;height:39px;left:17%;top:26%"></span><span class="orb" style="width:18px;height:18px;right:15%;top:43%;opacity:.8"></span>${mew}<span class="spark" style="left:15%;top:13%">✦</span><span class="spark" style="right:13%;top:22%">✧</span><span class="spark" style="right:18%;bottom:29%">✦</span><div class="caption"><b>MEW EX</b><small>PSYCHIC · DREAMWAVE</small></div><div class="shine"></div><div class="gloss"></div></div></div></div></article>`}
document.getElementById("grid").innerHTML=variants.map((_,i)=>cardMarkup(i)).join("");
let auto=true,raf=0,last=0;const stages=[...document.querySelectorAll(".stage")];
function setTilt(card,x,y){const rect=card.getBoundingClientRect(),nx=Math.max(0,Math.min(1,(x-rect.left)/rect.width)),ny=Math.max(0,Math.min(1,(y-rect.top)/rect.height));const ry=(nx-.5)*60,rx=(.5-ny)*60,dx=(nx-.5)*30,dy=(ny-.5)*30;card.style.setProperty("--rx",rx+"deg");card.style.setProperty("--ry",ry+"deg");card.style.setProperty("--dx",dx+"px");card.style.setProperty("--dy",dy+"px");card.style.setProperty("--shine",(nx-.5)*180);card.style.setProperty("--depth",Math.abs(dx)+Math.abs(dy))}
function reset(card){["--rx","--ry","--dx","--dy","--shine","--depth"].forEach(p=>card.style.removeProperty(p))}
stages.forEach(stage=>{const card=stage.querySelector(".card");stage.addEventListener("pointermove",e=>{if(e.pointerType==="touch"&&e.buttons===0)return;setTilt(card,e.clientX,e.clientY)});stage.addEventListener("pointerleave",()=>{if(!auto)reset(card)});stage.addEventListener("pointerdown",e=>{stage.setPointerCapture?.(e.pointerId);setTilt(card,e.clientX,e.clientY)})});
function animate(t){if(auto){stages.forEach((s,i)=>{if(s.matches(":hover"))return;const c=s.querySelector(".card"),a=t/1000+i*.72;const rx=Math.sin(a*1.25)*12,ry=Math.cos(a*.9)*18,dx=Math.cos(a)*9,dy=Math.sin(a*1.1)*9;c.style.setProperty("--rx",rx+"deg");c.style.setProperty("--ry",ry+"deg");c.style.setProperty("--dx",dx+"px");c.style.setProperty("--dy",dy+"px");c.style.setProperty("--shine",Math.sin(a)*90)})}raf=requestAnimationFrame(animate)}
document.getElementById("auto").addEventListener("click",e=>{auto=!auto;e.currentTarget.classList.toggle("active",auto);e.currentTarget.textContent="Auto-wiggle: "+(auto?"on":"off");if(!auto)stages.forEach(s=>reset(s.querySelector(".card")))});
document.getElementById("reset").addEventListener("click",()=>stages.forEach(s=>reset(s.querySelector(".card"))));
raf=requestAnimationFrame(animate);
</script>
</body></html>
