<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b16">
<title>Pokémon Region Cards — Style Lab</title>
<style>
:root{color-scheme:dark;--bg:#080b16;--line:#27324a;--muted:#9aa8c2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -12%,#29375a 0,#10172b 38%,var(--bg) 75%);color:#f5f7ff;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{max-width:1400px;margin:auto;padding:30px 24px 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:clamp(28px,5vw,48px);line-height:1;margin:0 0 10px;letter-spacing:-.045em}.sub{color:var(--muted);max-width:790px;margin:0}.back{color:#c4d2ff;text-decoration:none;border:1px solid var(--line);padding:8px 12px;border-radius:10px;white-space:nowrap}
main{max-width:1400px;margin:auto;padding:0 24px 50px}.region{margin:20px 0 38px}.region-head{display:flex;align-items:baseline;gap:12px;margin-bottom:13px}.region-head h2{margin:0;font-size:22px}.region-head span{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.card{position:relative;aspect-ratio:3/4.2;max-height:520px;min-width:0;overflow:hidden;border-radius:18px;background:#15213a;box-shadow:0 18px 42px #0009,0 0 0 1px #ffffff45;isolation:isolate;--a:#32d7c4;--b:#ed58d6;--c:#ffe38b}
.environment{position:absolute;inset:0;z-index:-3;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,var(--a) 0%,transparent 44%),radial-gradient(ellipse at 15% 90%,var(--b) 0%,transparent 52%),linear-gradient(155deg,#11142e 0%,#172d50 48%,#080d20 100%)}
.environment:before,.environment:after{content:"";position:absolute;inset:-25%;pointer-events:none}
.environment:before{background:repeating-conic-gradient(from 12deg at 50% 48%,#ffffff22 0deg 1deg,transparent 1deg 12deg);opacity:.28;mix-blend-mode:screen}
.environment:after{background:radial-gradient(ellipse at 50% 50%,transparent 25%,#020512b8 100%);box-shadow:inset 0 0 60px #000b}
.geometry{position:absolute;inset:0;width:100%;height:100%;opacity:.8;mix-blend-mode:screen}
.echo{position:absolute;z-index:0;width:112%;height:100%;left:-6%;top:-2%;object-fit:contain;pointer-events:none;opacity:.52;mix-blend-mode:screen;filter:grayscale(1) sepia(1) saturate(12) hue-rotate(var(--echo-hue,120deg)) contrast(1.5) brightness(1.12) drop-shadow(0 0 12px var(--a)) drop-shadow(0 0 26px var(--b))}
.echo.echo2{opacity:.27;transform:translate(7%,4%) scale(1.16);filter:grayscale(1) sepia(1) saturate(14) hue-rotate(calc(var(--echo-hue,120deg) + 125deg)) contrast(1.6) brightness(1.15);mix-blend-mode:color-dodge}
.mon{position:absolute;z-index:2;width:88%;height:78%;left:6%;top:4%;object-fit:contain;filter:drop-shadow(0 16px 10px #000c) drop-shadow(0 0 12px var(--a)) drop-shadow(0 0 4px #fff9)}
.card:after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;border:1px solid #ffffff65;border-radius:inherit;box-shadow:inset 0 0 28px #e8faff35}
.label{position:absolute;z-index:5;left:9px;right:9px;bottom:9px;padding:8px 9px;background:#080d20c9;border:1px solid #ffffff75;border-radius:10px;backdrop-filter:blur(8px);box-shadow:0 7px 18px #0009}
.label b{display:block;font-size:clamp(12px,1.45vw,17px);letter-spacing:.035em}.label small{font-size:9px;color:#e1e9ff;letter-spacing:.13em;text-transform:uppercase}
.style-tag{position:absolute;z-index:5;top:9px;left:9px;padding:5px 7px;border-radius:7px;background:#050a19b8;border:1px solid #ffffff55;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.card.s1{--echo-hue:35deg}.card.s1 .environment{background:radial-gradient(ellipse at 50% 28%,var(--c) 0%,transparent 38%),linear-gradient(145deg,var(--a),#17203d 54%,var(--b))}
.card.s1 .geometry{opacity:.42}
.card.s2{--echo-hue:175deg}.card.s2 .environment{background:radial-gradient(ellipse at 20% 22%,var(--c) 0%,transparent 34%),radial-gradient(ellipse at 80% 76%,var(--a) 0%,transparent 40%),repeating-linear-gradient(135deg,#ffffff12 0 2px,transparent 2px 16px),linear-gradient(155deg,#080d24,#30205a 52%,#071b34)}
.card.s2 .geometry{opacity:.95;filter:drop-shadow(0 0 5px var(--a))}
.card.s3{--echo-hue:265deg}.card.s3 .environment{background:radial-gradient(ellipse at 50% 50%,var(--c) 0%,transparent 24%),repeating-radial-gradient(ellipse at 50% 50%,#ffffff19 0 1px,transparent 2px 14px),conic-gradient(from 20deg at 50% 45%,var(--a),#111332,var(--b),#111332,var(--a))}
.card.s3 .geometry{opacity:1;filter:drop-shadow(0 0 8px var(--b))}
.card.s4{--echo-hue:320deg}.card.s4 .environment{background:conic-gradient(from 0deg at 50% 50%,var(--a),#10112c,var(--b),#15103a,var(--c),#10112c,var(--a));filter:saturate(1.6)}
.card.s4 .geometry{opacity:1;filter:drop-shadow(0 0 11px var(--a)) drop-shadow(0 0 18px var(--b))}
.card.s4 .echo{opacity:.68}.card.s4 .echo.echo2{opacity:.46}
.card.s4 .mon{filter:drop-shadow(0 0 9px white) drop-shadow(0 0 18px var(--a)) drop-shadow(0 0 30px var(--b))}
@media(max-width:850px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{border-radius:13px}.label{left:7px;right:7px;bottom:7px;padding:7px}.style-tag{top:7px;left:7px}}
@media(max-width:560px){header{padding:24px 16px 18px}.top{align-items:flex-start}main{padding:0 12px 35px}.region{margin:18px 0 30px}.region-head h2{font-size:20px}}
</style>
</head>
<body>
<header><div class="top"><div><h1>POKÉMON / REGION STYLE LAB</h1><p class="sub">Four individually art-directed worlds for every region. Every card has its own environment, visual motif, lighting and color story, with the Pokémon's own SVG reused for the foreground and neon echo layers.</p></div><a class="back" href="../cardtrial2/">← Card Lab 2</a></div></header>
<main id="regions"></main>
<script>
const regions=[
["Kanto",1,[[25,"Pikachu"],[6,"Charizard"]],[["Vermilion Afterdark","city",["#ffb13b","#ff4f79","#5b6dff"]],["Viridian Lost World","jungle",["#b8e76b","#24a879","#e9b85c"]],["Lavender Dream Logic","dream",["#f8a6e8","#8a83ff","#ffdf92"]],["Cerulean Glitch Lab","glitch",["#4de9ed","#3274e9","#f45dbb"]]]],
["Johto",2,[[249,"Lugia"],[250,"Ho-Oh"]],[["Ecruteak Spirit Gate","shrine",["#f4c66e","#a76bcb","#8ce8dc"]],["Ilex Clockwork Grove","clock",["#b6d77c","#d69a50","#70c6a1"]],["Tin Tower Goldfall","gold",["#fff0a0","#e89a43","#b68bff"]],["Whirl Islands Abyss","abyss",["#5ce3e5","#3978cb","#c0a6ff"]]]],
["Hoenn",3,[[384,"Rayquaza"],[282,"Gardevoir"]],[["Sootopolis Glass Sea","undersea",["#72f2e6","#2486c7","#b3f2ff"]],["Mt. Chimney Inferno","volcano",["#ffb14e","#f04d37","#8c326b"]],["Sky Pillar Ascension","sky",["#b4e9ff","#7c9aff","#f7d4a2"]],["Seafloor Collapse","trench",["#3bd8cf","#22619e","#bd75e8"]]]],
["Sinnoh",4,[[483,"Dialga"],[484,"Palkia"]],[["Spear Pillar Paradox","cosmos",["#9ee8ff","#9c8cff","#fff0a1"]],["Mt. Coronet Crystal","crystal",["#b8f5ff","#8ca8ff","#e2b8ff"]],["Lake Guardians","mirror",["#a9f5d5","#6d9eea","#f4b8e8"]],["Distortion World","distortion",["#f18bdb","#5a65d9","#70e6d0"]]]],
["Unova",5,[[643,"Reshiram"],[644,"Zekrom"]],[["Castelia Neon Canyon","skyline",["#ff9b62","#f05d91","#6f8fff"]],["Relic Castle Mirage","desert",["#f4d17b","#db8956","#9c78ce"]],["Chargestone Storm","storm",["#9cecff","#4f83ec","#d6a4ff"]],["Dreamyard Surrealism","storybook",["#ffb8c9","#a9a2ff","#a5efd7"]]]],
["Kalos",6,[[716,"Xerneas"],[717,"Yveltal"]],[["Lumiose Haute Couture","artnouveau",["#f6b1d9","#7ce0d4","#f8dc91"]],["Reflection Cave","prism",["#a4f0f3","#bc9cff","#ffb4dc"]],["Fairy Garden Impossible","garden",["#ffb5e7","#c2f18d","#a6b7ff"]],["Anistar Star Clock","eclipse",["#f4c5ff","#797ce8","#ffcf87"]]]],
["Alola",7,[[791,"Solgaleo"],[792,"Lunala"]],[["Hau'oli Festival","festival",["#ffb56c","#f47fbb","#58dccc"]],["Ultra Space Bloom","alien",["#ed8cff","#55e8c8","#f6df73"]],["Poni Island Monsoon","monsoon",["#6de8e0","#6d87dc","#f8b6a2"]],["Altar of the Sun-Moon","celestial",["#f8d77d","#a68af1","#7de5eb"]]]],
["Galar",8,[[888,"Zacian"],[889,"Zamazenta"]],[["Wyndon After Hours","stadium",["#f18a9d","#759dff","#f4d18a"]],["Slumbering Weald","mistwood",["#a9d99a","#7b8fe0","#d5b5ef"]],["Crown Tundra Aurora","aurora",["#91f2ee","#8b9eff","#f5d5ff"]],["Dynamax Rift","rift",["#ff557c","#ffb05d","#7b76ff"]]]]
];
const ns="http://www.w3.org/2000/svg";
function makeScene(kind,c,seed){
 const [a,b,d]=c,P=[];const add=s=>P.push(s);
 add('<defs><linearGradient id="g" x2=".1" y2="1"><stop stop-color="'+a+'"/><stop offset=".55" stop-color="'+b+'"/><stop offset="1" stop-color="#080d25"/></linearGradient><radialGradient id="h"><stop stop-color="'+d+'" stop-opacity=".9"/><stop offset="1" stop-color="'+d+'" stop-opacity="0"/></radialGradient></defs><rect width="300" height="420" fill="url(#g)"/><ellipse cx="'+(90+seed*17%120)+'" cy="145" rx="160" ry="190" fill="url(#h)"/>');
 const path=(p,col=a,w=3,op=.6)=>add('<path d="'+p+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" opacity="'+op+'" stroke-linecap="round"/>');
 const circ=(x,y,r,col=d,op=.7)=>add('<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+col+'" opacity="'+op+'"/>');
 const poly=(p,col=a,op=.65)=>add('<polygon points="'+p+'" fill="'+col+'" opacity="'+op+'"/>');
 for(let i=0;i<24;i++)circ(i*83%300,i*137%420,i%8===0?2.5:1,"#fff",.25);
 if(["city","skyline","stadium"].includes(kind)){for(let i=0;i<13;i++){let x=i*25-8,w=15+i*7%16,h=75+(i*47+seed*17)%230;add('<rect x="'+x+'" y="'+(420-h)+'" width="'+w+'" height="'+h+'" fill="'+(i%2?b:d)+'" opacity=".8"/>');for(let y=420-h+13;y<410;y+=19)add('<path d="M'+(x+4)+' '+y+'h3m5 0h3" stroke="#fff8" stroke-width="3"/>')}if(kind==="stadium")path("M12 285 Q150 75 288 285",d,14,.65)}
 else if(["jungle","mistwood","garden","alien"].includes(kind)){for(let i=0;i<17;i++){let x=i*19-10,h=100+(i*37+seed*11)%240;add('<path d="M'+x+' 420 Q'+(x-30)+' '+(420-h/2)+' '+(x+5)+' '+(420-h)+' Q'+(x+35)+' '+(420-h/2)+' '+x+' 420" fill="'+(i%2?a:b)+'" opacity=".7"/>')}if(kind==="garden"||kind==="alien")for(let i=0;i<10;i++){let x=i*29,y=100+i*23%230;circ(x,y,9,d,.9);for(let j=0;j<6;j++)add('<ellipse cx="'+x+'" cy="'+y+'" rx="5" ry="20" fill="'+(j%2?a:b)+'" transform="rotate('+(j*60)+' '+x+' '+y+')" opacity=".7"/>')}}
 else if(["undersea","abyss","trench","monsoon"].includes(kind)){for(let i=0;i<10;i++)path("M-20 "+(55+i*38)+" Q60 "+(20+i*38)+" 130 "+(55+i*38)+" T320 "+(45+i*38),i%2?a:d,3,.6);for(let i=0;i<20;i++)circ(i*53%300,i*79%400,2+i%4,d,.6);if(kind==="trench"||kind==="abyss"){poly("0,100 90,230 120,420 0,420","#07142d",.85);poly("300,90 210,230 180,420 300,420","#07142d",.85)}}
 else if(["volcano","desert","crystal"].includes(kind)){if(kind==="volcano"){poly("0,330 80,110 145,260 220,70 300,340 300,420 0,420","#34213b",.95);path("M80 110L110 185 145 260 220 70 245 180",d,13,.9)}if(kind==="desert"){for(let i=0;i<6;i++)path("M-30 "+(180+i*45)+" Q80 "+(100+i*55)+" 160 "+(180+i*45)+" T330 "+(170+i*45),i%2?a:d,15,.4);circ(220,95,40,d,.8)}if(kind==="crystal")for(let i=0;i<15;i++){let x=i*23-10,h=90+i*37%240;poly(x+",420 "+(x+18)+","+(420-h)+" "+(x+42)+",420",i%2?a:d,.7)}}
 else if(["shrine","artnouveau","celestial","storybook"].includes(kind)){for(let i=0;i<5;i++){let x=18+i*65;add('<path d="M'+x+' 330V'+(110+i%2*25)+' q27 -42 54 0V330" fill="none" stroke="'+(i%2?a:d)+'" stroke-width="9" opacity=".75"/>')}poly("0,330 Q150,280 300,330 300,420 0,420","#10152d",.75);if(kind==="artnouveau")for(let i=0;i<8;i++)path("M"+i*42+" 420 Q"+(i*42+50)+" 260 "+(i*42+5)+" 120 Q"+(i*42+70)+" 200 "+(i*42+30)+" 310",a,4,.7);if(kind==="celestial"||kind==="storybook")for(let i=0;i<6;i++){let x=150+Math.cos(i*Math.PI/3)*85,y=150+Math.sin(i*Math.PI/3)*85;circ(x,y,10,d,.9);path("M150 150L"+x+" "+y,a,2,.7)}}
 else if(["clock","eclipse","cosmos","gold"].includes(kind)){for(let i=0;i<8;i++)add('<circle cx="150" cy="190" r="'+(30+i*27)+'" fill="none" stroke="'+(i%2?a:d)+'" stroke-width="'+(i%3+1)+'" opacity=".5"/>');path("M150 190L150 45 M150 190L250 250",d,5,.9);for(let i=0;i<12;i++){let q=i*Math.PI/6;circ(150+Math.cos(q)*135,190+Math.sin(q)*135,3,a,.9)}if(kind==="eclipse")circ(150,190,67,"#080d25",.9),circ(174,165,64,d,.8);if(kind==="gold")for(let i=0;i<22;i++)path("M"+i*17+" 0l-20 420","#fff0b8",2,.35)}
 else if(["prism","mirror","distortion","rift","glitch","storm"].includes(kind)){for(let i=0;i<17;i++){let x=i*41%300,y=i*67%420;poly(x+","+(y-90)+" "+(x+65)+","+y+" "+x+","+(y+90)+" "+(x-65)+","+y,[a,b,d][i%3],.3)}if(kind==="mirror")path("M0 210H300","#fff",4,.8);if(kind==="rift")path("M150 -20L110 120 170 170 115 280 165 440","#fff",19,.9);if(kind==="glitch")for(let i=0;i<19;i++)path("M0 "+i*23+"h"+(65+i*7),i%2?a:d,2+i%7,.85);if(kind==="distortion")path("M0 80 Q150 300 300 80 M0 340 Q150 120 300 340",d,12,.7);if(kind==="storm")for(let i=0;i<8;i++)path("M"+i*42+" 0L"+(i*42-40)+" 160 "+(i*42+20)+" 210",d,5,.75)}
 else if(["sky","aurora"].includes(kind)){for(let i=0;i<8;i++)path("M-40 "+(65+i*35)+" Q60 "+i*22+" 150 "+(65+i*35)+" T340 "+(55+i*35),[a,b,d][i%3],16,.4);for(let i=0;i<5;i++)poly((i*75-20)+",420 "+(i*75+50)+","+(170+i%2*50)+" "+(i*75+120)+",420","#d8f5ff",.42)}
 else if(kind==="festival"){for(let i=0;i<12;i++){let x=i*27;path("M"+x+" 0L"+(x+45)+" 95",d,2,.6);poly((x+33)+",95 "+(x+57)+",95 "+(x+45)+",122",[a,b,d][i%3],.9)}for(let i=0;i<16;i++)circ(i*47%300,(i*83+80)%300,5+i%4*2,[a,b,d][i%3],.9)}
 add('<rect width="300" height="420" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>');
 return '<svg class="scene" viewBox="0 0 300 420" preserveAspectRatio="xMidYMid slice" xmlns="'+ns+'">'+P.join("")+'</svg>';
}
const root=document.getElementById("regions");
regions.forEach((r,ri)=>{const section=document.createElement("section");section.className="region";section.innerHTML='<div class="region-head"><h2>'+r[0]+'</h2><span>Generation '+r[1]+' · 4 original worlds</span></div><div class="cards"></div>';const cards=section.querySelector(".cards");
r[3].forEach((theme,si)=>{const [title,kind,colors]=theme,[id,name]=r[2][si%2];const card=document.createElement("article");card.className="card";card.style.setProperty("--glow",colors[0]);card.style.setProperty("--glow2",colors[1]);card.style.setProperty("--echo-hue",(ri*43+si*77)%360+"deg");card.innerHTML=makeScene(kind,colors,ri*4+si+1);
const art=document.createElement("img");art.className="echo";art.alt="";art.draggable=false;art.src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/"+id+".svg";const echo2=art.cloneNode();echo2.className="echo echo2";
const mon=document.createElement("img");mon.className="mon";mon.alt=name;mon.draggable=false;mon.loading="lazy";mon.src=art.src;mon.onerror=()=>{mon.onerror=null;const png="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/"+id+".png";mon.src=png;art.src=png;echo2.src=png};
const tag=document.createElement("div");tag.className="style-tag";tag.textContent=title;const label=document.createElement("div");label.className="label";label.innerHTML="<b>"+name+"</b><small>"+r[0]+" · "+kind.replace(/([A-Z])/g," $1")+"</small>";card.append(art,echo2,mon,tag,label);cards.append(card)});root.append(section)});
</script>
</body></html>
