<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b16">
<title>Pokémon Region Cards</title>
<style>
:root{color-scheme:dark;--bg:#080b16;--line:#27324a;--muted:#9aa8c2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -12%,#29375a 0,#10172b 38%,var(--bg) 75%);color:#f5f7ff;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{max-width:1400px;margin:auto;padding:30px 24px 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:clamp(28px,5vw,48px);line-height:1;margin:0 0 10px;letter-spacing:-.045em}.sub{color:var(--muted);max-width:760px;margin:0}.back{color:#c4d2ff;text-decoration:none;border:1px solid var(--line);padding:8px 12px;border-radius:10px;white-space:nowrap}
main{max-width:1400px;margin:auto;padding:0 24px 50px}.region{margin:20px 0 38px}.region-head{display:flex;align-items:baseline;gap:12px;margin-bottom:13px}.region-head h2{margin:0;font-size:22px}.region-head span{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{position:relative;aspect-ratio:3/4.2;max-height:560px;overflow:hidden;border-radius:18px;background:#15213a;box-shadow:0 18px 42px #0009,0 0 0 1px #ffffff45;isolation:isolate}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0001 0%,#0000 48%,#050914a8 100%);z-index:-1}
.mon{position:absolute;width:88%;height:78%;left:6%;top:4%;object-fit:contain;filter:drop-shadow(0 16px 10px #000b) drop-shadow(0 0 14px #ffffff75)}
.name{position:absolute;left:12px;right:12px;bottom:12px;padding:10px 12px;background:#10182bd9;border:1px solid #ffffff70;border-radius:11px;backdrop-filter:blur(8px);box-shadow:0 6px 18px #0008}
.name b{display:block;font-size:clamp(15px,2.2vw,21px);letter-spacing:.04em}.name small{font-size:10px;color:#d2dcf2;letter-spacing:.14em;text-transform:uppercase}
@media(max-width:560px){header{padding:24px 16px 18px}.top{align-items:flex-start}main{padding:0 12px 35px}.cards{gap:10px}.card{border-radius:13px}.name{left:7px;right:7px;bottom:7px;padding:7px}.name small{font-size:8px}.region{margin:18px 0 30px}}
</style>
</head>
<body>
<header><div class="top"><div><h1>POKÉMON / REGION CARDS</h1><p class="sub">Two starter card concepts for each of the eight Destination Pokémon poster regions. Each poster fills the card edge-to-edge, with the Pokémon SVG artwork layered in front.</p></div><a class="back" href="../cardtrial2/">← Card Lab 2</a></div></header>
<main id="regions"></main>
<script>
const regions=[
{name:"Kanto",gen:1,poster:"https://efour.b-cdn.net/uploads/default/original/4X/4/d/e/4de9fe65db7f91b5a6905fa445684d5850bf2865.jpeg",pokemon:[[25,"Pikachu"],[6,"Charizard"]]},
{name:"Johto",gen:2,poster:"https://efour.b-cdn.net/uploads/default/original/4X/e/6/d/e6d4d0c9b7c7c2b2744602d20267eb7f01024e70.jpeg",pokemon:[[249,"Lugia"],[250,"Ho-Oh"]]},
{name:"Hoenn",gen:3,poster:"https://efour.b-cdn.net/uploads/default/original/4X/1/b/e/1be788bc15e0bf8cd8f384543ce11b5ab84f9381.jpeg",pokemon:[[384,"Rayquaza"],[282,"Gardevoir"]]},
{name:"Sinnoh",gen:4,poster:"https://efour.b-cdn.net/uploads/default/original/4X/5/4/8/54808a1e8784b518216d2b53799b5c7941617ee5.jpeg",pokemon:[[483,"Dialga"],[484,"Palkia"]]},
{name:"Unova",gen:5,poster:"https://efour.b-cdn.net/uploads/default/original/4X/a/f/a/afa15bba8e369178a302fa5874523d79407f2d16.jpeg",pokemon:[[643,"Reshiram"],[644,"Zekrom"]]},
{name:"Kalos",gen:6,poster:"https://efour.b-cdn.net/uploads/default/original/4X/7/8/b/78b6ecb108fb42ee312b8dc85adaaa8163483df9.jpeg",pokemon:[[716,"Xerneas"],[717,"Yveltal"]]},
{name:"Alola",gen:7,poster:"https://efour.b-cdn.net/uploads/default/original/4X/5/a/3/5a34ca22032c44d205335f13d2d936c3410d872a.jpeg",pokemon:[[791,"Solgaleo"],[792,"Lunala"]]},
{name:"Galar",gen:8,poster:"https://efour.b-cdn.net/uploads/default/original/4X/a/f/b/afb8c52b623edd40207f3584db79b8405b735636.jpeg",pokemon:[[888,"Zacian"],[889,"Zamazenta"]]}
];
const root=document.getElementById("regions");
for(const r of regions){
 const section=document.createElement("section");section.className="region";
 section.innerHTML='<div class="region-head"><h2>'+r.name+'</h2><span>Generation '+r.gen+' · 2 concepts</span></div><div class="cards"></div>';
 const cards=section.querySelector(".cards");
 for(const [id,name] of r.pokemon){
  const card=document.createElement("article");card.className="card";
  const poster=document.createElement("img");poster.className="poster";poster.src=r.poster;poster.alt=r.name+" Destination Pokémon poster";poster.loading="lazy";
  const mon=document.createElement("img");mon.className="mon";mon.src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/"+id+".svg";mon.alt=name;mon.loading="lazy";mon.onerror=()=>{mon.onerror=null;mon.src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/"+id+".png"};
  const label=document.createElement("div");label.className="name";label.innerHTML="<b>"+name+"</b><small>"+r.name+" · No. "+String(id).padStart(4,"0")+"</small>";
  card.append(poster,mon,label);cards.append(card);
 }
 root.append(section);
}
</script>
</body></html>
